version: "3.8"
services:
  db:
    image: postgres:16
    container_name: boun_scheduler_db
    environment:
      POSTGRES_DB: boun_scheduler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
